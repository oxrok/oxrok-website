{{ define "main" }}
  <article>
    {{ .Content }}
    {{ if .RegularPages }}
    <ul class="posts">
      {{ range .RegularPages }}
      <li>
        <span class="date">{{ .Date.Format "2006-01-02" }}</span>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
      {{ end }}
    </ul>
    {{ else }}
    <p>No posts yet. The first is being written.</p>
    {{ end }}
  </article>
{{ end }}
