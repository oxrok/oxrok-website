<svg viewBox="0 0 640 200" role="img" aria-label="{{ T "emu_aria" }}" style="display:block;width:100%;height:auto;margin:1.2rem 0">
  <defs>
    <style>
      .t { fill: var(--fg, #1c1e21); font: 600 13.5px system-ui, -apple-system, sans-serif; }
      .s { fill: var(--muted, #5f6670); font: 11px system-ui, -apple-system, sans-serif; }
      .al { fill: var(--muted, #5f6670); font: 11px system-ui, -apple-system, sans-serif; }
      .arrow { stroke: var(--muted, #5f6670); stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <!-- oxrok-emu -->
  <rect x="16" y="44" width="172" height="132" rx="10" fill="var(--steel, #557a9c)" fill-opacity="0.07" stroke="var(--steel, #557a9c)" stroke-width="1.5"/>
  <text class="t" x="102" y="72" text-anchor="middle">{{ T "emu_oxrokemu" }}</text>
  <text class="s" x="102" y="92" text-anchor="middle">{{ T "emu_model" }}</text>
  <text class="s" x="102" y="112" text-anchor="middle">{{ T "emu_pedantic" }}</text>
  <text class="s" x="102" y="130" text-anchor="middle">{{ T "emu_fault" }}</text>
  <text class="s" x="102" y="148" text-anchor="middle">{{ T "emu_tlog" }}</text>

  <!-- Linux kernel -->
  <rect x="236" y="44" width="172" height="132" rx="10" fill="var(--fg, #1c1e21)" fill-opacity="0.04" stroke="var(--faint, #8b929c)" stroke-width="1.5"/>
  <text class="t" x="322" y="72" text-anchor="middle">{{ T "emu_kernel" }}</text>
  <text class="s" x="322" y="92" text-anchor="middle">{{ T "emu_vhci" }}</text>
  <text class="s" x="322" y="110" text-anchor="middle">{{ T "emu_vhost" }}</text>
  <text class="s" x="322" y="128" text-anchor="middle">{{ T "emu_usbcore" }}</text>

  <!-- the two tools -->
  <rect x="456" y="44" width="176" height="56" rx="10" fill="var(--accent, #c8501e)" fill-opacity="0.07" stroke="var(--accent, #c8501e)" stroke-width="1.5"/>
  <text class="t" x="544" y="68" text-anchor="middle">{{ T "emu_sigrok" }}</text>
  <text class="s" x="544" y="86" text-anchor="middle">{{ T "emu_oracle" }}</text>
  <rect x="456" y="120" width="176" height="56" rx="10" fill="var(--accent, #c8501e)" fill-opacity="0.07" stroke="var(--accent, #c8501e)" stroke-width="1.5"/>
  <text class="t" x="544" y="144" text-anchor="middle">{{ T "emu_oxrok" }}</text>
  <text class="s" x="544" y="162" text-anchor="middle">{{ T "emu_port" }}</text>

  <!-- arrows -->
  <line class="arrow" x1="188" y1="110" x2="236" y2="110"/>
  <polygon points="236,110 227,105 227,115" fill="var(--muted, #5f6670)"/>
  <polygon points="188,110 197,105 197,115" fill="var(--muted, #5f6670)"/>
  <text class="al" x="212" y="30" text-anchor="middle">{{ T "emu_usbip" }}</text>

  <line class="arrow" x1="408" y1="110" x2="456" y2="110"/>
  <polygon points="456,110 447,105 447,115" fill="var(--muted, #5f6670)"/>
  <text class="al" x="432" y="30" text-anchor="middle">{{ T "emu_usbbus" }}</text>
</svg>
