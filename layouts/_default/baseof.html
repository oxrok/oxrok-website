<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}oxrok</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="{{ if not .IsHome }}{{ .Title }} · {{ end }}oxrok">
  <meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "logo/avatar.png" | absURL }}">
  <link rel="icon" href="{{ "logo/mark.svg" | relURL }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="stylesheet" href="/pagefind/pagefind-component-ui.css">
  <link rel="alternate" type="application/rss+xml" title="oxrok" href="{{ "index.xml" | relURL }}">
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">
      <img src="{{ "logo/lockup.svg" | relURL }}" alt="oxrok" width="132" height="47">
    </a>
    {{ $p := .RelPermalink }}
    <nav aria-label="Site">
      <a href="{{ "devices/" | relURL }}"{{ if hasPrefix $p (relURL "devices/") }} aria-current="page"{{ end }}>Devices</a>
      <a href="{{ "start/" | relURL }}"{{ if hasPrefix $p (relURL "start/") }} aria-current="page"{{ end }}>Get started</a>
      <a href="{{ "testing/" | relURL }}"{{ if hasPrefix $p (relURL "testing/") }} aria-current="page"{{ end }}>Testing</a>
      <a href="{{ "docs/" | relURL }}"{{ if hasPrefix $p (relURL "docs/") }} aria-current="page"{{ end }}>Docs</a>
      <a href="{{ "blog/" | relURL }}"{{ if hasPrefix $p (relURL "blog/") }} aria-current="page"{{ end }}>Blog</a>
      <a class="gh" href="{{ .Site.Params.repo }}" rel="noopener">GitHub</a>
      <span id="pagefind"></span>
    </nav>
  </div>
</header>
<main class="wrap" id="main">
  {{ block "main" . }}{{ end }}
</main>
<footer class="site">
  <div class="wrap">
    <p>
      <a href="{{ .Site.Params.repo }}">GitHub</a>
      · <a href="{{ .Site.Params.website_repo }}">this site</a>
      · <a href="{{ .Site.Params.repo }}/blob/main/docs/DEVICES.md">device docs</a>
      · <a href="{{ .Site.Params.repo }}/blob/main/docs/ROADMAP.md">roadmap</a>
      · <a href="{{ "index.xml" | relURL }}">RSS</a>
    </p>
    <p class="fine">GPL-3.0-or-later · written by an LLM, directed by a person</p>
  </div>
</footer>
<script src="/pagefind/pagefind-component-ui.js" charset="utf-8" defer></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    new PagefindUI({ element: "#pagefind", showSubFields: true });
  });
</script>
<script>
  // Copy buttons on terminal blocks and connect lines.
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button.copy");
    if (!b) return;
    var host = b.closest(".term") || b.closest(".connbox");
    if (!host) return;
    var src = host.querySelector("pre, .conn");
    if (!src) return;
    var copy = src.cloneNode(true);
    copy.querySelectorAll(".prompt").forEach(function (el) { el.remove(); });
    var text = copy.innerText.trim();
    var done = function () {
      b.textContent = "copied";
      b.classList.add("done");
      setTimeout(function () {
        b.textContent = "copy";
        b.classList.remove("done");
      }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () {});
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (err) {}
      document.body.removeChild(ta);
    }
  });
</script>
</body>
</html>
