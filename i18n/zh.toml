[home_written_h]
other = "它是如何写成的"
[home_written_p1]
other = "oxrok 是把 sigrok 的 C 与 Python 代码翻译为 Rust 的成果，由大语言模型完成，并由人工主导工作：选择要移植什么、审查结构和协议处理、连接测试台硬件并运行对比。阅读代码时请牢记这一点，并可查阅{link}来了解每个驱动经过哪些验证。"
[home_written_link]
other = "驱动表"
[home_written_p2]
other = "来了解每个驱动经过哪些验证。"

[home_tested_h]
other = "它是如何测试的"
[home_tested_p]
other = "这些驱动中的大多数硬件我们并不拥有，因此我们让内核以为我们拥有它们：每个驱动都是一个 Rust 模型，通过 USB/IP（<code>vhci-hcd</code>）挂载，在内核看来就是一个真实的 USB 设备。真实的 sigrok-cli 和 oxrok 随后不加修改地对同一设备运行，每一次传输都被记录并对比。这些模型被刻意设计为会出错——停止响应、拔插、延迟回复、错误帧。{link}。"
[home_tested_link]
other = "完整的方法及其局限"

[home_vusb_p1]
other = "这些模型运行在{link}之上——这是一个虚拟 USB 库，它把一个纯 Rust 代码构成的设备放到了总线上。"
[home_vusb_link]
other = "vusb"
[home_vusb_p2]
other = "之上——这是一个虚拟 USB 库，它把一个纯 Rust 代码构成的设备放到了总线上。"

