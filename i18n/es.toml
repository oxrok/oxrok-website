# --- Decoders (layouts/decoders/list.html) ----------------------------------

[nav_decoders]
other = "Decodificadores"

[dec_intro]
other = "oxrok ejecuta los decodificadores de protocolo de sigrok con las opciones de sigrok-cli: <code>-P</code> para ejecutar uno, <code>-A</code> y <code>-B</code> para elegir la salida. {{ .native }} de los {{ .total }} decodificadores de libsigrokdecode {{ .ref }} son Rust nativo, y los decodificadores Python sin modificar también funcionan, sobre RustPython o CPython."
[dec_stat_native]
other = "de los {{ .total }} decodificadores de libsigrokdecode {{ .ref }}, nativos"
[dec_stat_parity]
other = "con prueba de paridad frente al original en Python"
[dec_stat_logic]
other = "leen muestras lógicas"
[dec_stat_stacked]
other = "se apilan sobre otro decodificador"

[dec_backends_h]
other = "Tres formas de ejecutar un decodificador"
[dec_backends_p]
other = "Un id de decodificador significa lo mismo en todas partes: los mismos canales, opciones, clases de anotación y salida. Lo que cambia es el código que lo ejecuta."
[dec_native_h]
other = "Nativo"
[dec_native_p]
other = "Decodificadores escritos en Rust y compilados dentro de oxrok. Todas las compilaciones los incluyen, sin intérprete y sin archivos que instalar. Son los que se ejecutan por defecto."
[dec_rustpython_h]
other = "RustPython"
[dec_rustpython_p]
other = "Un intérprete de Python escrito en Rust, incluido en el binario junto con su biblioteca estándar. Ejecuta los archivos <code>pd.py</code> de libsigrokdecode sin cambios y no necesita Python en la máquina."
[dec_cpython_h]
other = "CPython"
[dec_cpython_p]
other = "El Python del sistema, enlazado mediante PyO3. Ejecuta los mismos archivos <code>pd.py</code> y es el más rápido de los dos anfitriones Python."

[dec_row_build]
other = "Compilación"
[dec_build_native]
other = "Siempre activo"
[dec_build_rustpython_note]
other = "activo en los binarios publicados"
[dec_row_runs]
other = "Ejecuta"
[dec_runs_native]
other = "Decodificadores Rust compilados dentro"
[dec_runs_python]
other = "Los decodificadores <code>pd.py</code> de libsigrokdecode, sin cambios, mediante un módulo <code>sigrokdecode</code> que aporta oxrok"
[dec_row_needs]
other = "Necesita al ejecutarse"
[dec_needs_native]
other = "Nada"
[dec_needs_rustpython]
other = "El directorio <code>decoders/</code>"
[dec_needs_cpython]
other = "Python 3.9+ con su biblioteca compartida, y el directorio <code>decoders/</code>"
[dec_row_for]
other = "Úsalo para"
[dec_for_native]
other = "Decodificar a diario"
[dec_for_rustpython]
other = "Decodificadores Python propios o más nuevos, sin instalar nada más"
[dec_for_cpython]
other = "Decodificadores Python en una máquina con Python, cuando importa el tiempo de decodificación"

[dec_choose_h]
other = "Cuál se ejecuta"
[dec_choose_p]
other = "Un decodificador nativo siempre tiene prioridad sobre un decodificador Python con el mismo id. Los decodificadores Python se buscan en <code>OXROK_DECODERS_DIR</code>, <code>SIGROKDECODE_DIR</code>, <code>decoders</code> junto al ejecutable, <code>~/.local/share/libsigrokdecode/decoders</code> y los directorios del sistema. Con los dos anfitriones Python compilados, se usa CPython salvo que se indique <code>OXROK_PYTHON=rustpython</code>. Los decodificadores nativos y Python se apilan libremente: <code>-P uart,midi</code> funciona ejecute quien ejecute cada capa."
[dec_install_p]
other = "La {link} tiene los comandos de compilación de cada opción."
[dec_install_link]
other = "página de instalación"

[dec_checked_h]
other = "Cómo se comprueban"
[dec_checked_p]
other = "Cada decodificador nativo tiene una prueba de paridad: se ejecuta en el mismo proceso que el decodificador Python del que se portó, con la misma captura y configuración, y toda la secuencia de salida (anotaciones, rangos de muestras, salida binaria, elementos pasados a decodificadores apilados y metadatos) debe coincidir. El corpus de sigrok-test es una ejecución más amplia y opcional de la misma comparación. <code>uart</code>, <code>i2c</code> y <code>spi</code> también se comparan byte a byte con sigrok-cli. Los dos anfitriones Python imprimen los mismos bytes en las ejecuciones de sigrok-test. La {link} (en inglés) tiene los detalles."
[dec_docs_link]
other = "documentación de decodificadores"

