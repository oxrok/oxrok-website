[home_written_h]
other = "Cómo se escribió"
[home_written_p1]
other = "oxrok es una traducción del código C y Python de sigrok a Rust, realizada por un modelo de lenguaje de gran tamaño, con una persona dirigiendo el trabajo: eligiendo qué portar, revisando la estructura y el manejo de protocolos, conectando el hardware de banco y ejecutando las comparaciones. Lee el código con eso en mente y consulta la {link} para ver qué tipo de evidencia ha tenido cada uno."
[home_written_link]
other = "tabla de drivers"
[home_written_p2]
other = "para ver qué tipo de evidencia ha tenido cada uno."

[home_tested_h]
other = "Cómo se prueba"
[home_tested_p]
other = "No tenemos el hardware de la mayoría de estos drivers, así que hacemos que el kernel crea que sí: cada uno es un modelo en Rust, conectado por USB/IP (<code>vhci-hcd</code>) para que sea un dispositivo USB real a ojos del kernel. El sigrok-cli real y oxrok se ejecutan sin modificaciones contra el mismo dispositivo, registrando y comparando cada transacción. Los modelos están hechos para comportarse mal: bloqueos, desconexiones, respuestas tardías, tramas defectuosas. {link}."
[home_tested_link]
other = "El método completo, y sus límites"

[home_vusb_p1]
other = "Los modelos se ejecutan sobre {link}, una biblioteca USB virtual que pone en el bus un dispositivo que es solo código Rust."
