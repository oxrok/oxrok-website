# --- Home page (layouts/index.html) ---------------------------------------

[home_h1]
other = "The sigrok stack, in Rust"
[home_lede]
other = "A library, drivers and a command line tool for logic analyzers, scopes and meters. It builds with <code>cargo</code> alone, links no C sigrok library, and takes sigrok-cli's flags, file formats, driver ids and decoder ids."
[home_tag]
other = "Experimental. Most drivers have never run on real hardware."
[home_cta_start]
other = "Get started"
[home_cta_devices]
other = "Find your device"
[home_cta_ui]
