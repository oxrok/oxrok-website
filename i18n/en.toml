# --- Decoders (layouts/decoders/list.html) ----------------------------------

[nav_decoders]
other = "Decoders"

[dec_intro]
other = "oxrok runs sigrok's protocol decoders with sigrok-cli's flags: <code>-P</code> to run one, <code>-A</code> and <code>-B</code> to pick the output. {{ .native }} of the {{ .total }} decoders in libsigrokdecode {{ .ref }} are native Rust, and the unchanged Python decoders run too, on RustPython or CPython."
[dec_stat_native]
other = "of libsigrokdecode {{ .ref }}'s {{ .total }} decoders native"
[dec_stat_parity]
other = "parity-tested against the Python original"
[dec_stat_logic]
other = "read logic samples"
[dec_stat_stacked]
other = "stack on another decoder"

[dec_backends_h]
other = "Three ways to run a decoder"
[dec_backends_p]
other = "A decoder id means the same thing everywhere: the same channels, options, annotation classes and output. What changes is the code that runs it."
[dec_native_h]
other = "Native"
[dec_native_p]
other = "Decoders written in Rust and compiled into oxrok. Every build has them, with no interpreter and no files to install. They are what runs by default."
[dec_rustpython_h]
other = "RustPython"
[dec_rustpython_p]
other = "A Python interpreter written in Rust, built into the binary with its standard library. It runs libsigrokdecode's <code>pd.py</code> files unchanged and needs no Python on the machine."
[dec_cpython_h]
other = "CPython"
[dec_cpython_p]
other = "The system's own Python, linked through PyO3. It runs the same <code>pd.py</code> files and is the faster of the two Python hosts."

[dec_row_build]
other = "Build"
[dec_build_native]
other = "Always on"
[dec_build_rustpython_note]
