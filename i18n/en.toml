[home_find_h]
other = "Find your device"

[home_col1_h]
other = "Same interface as sigrok"
[home_col1_p]
other = "sigrok-cli's flags, file formats, driver and decoder ids. libsigrokdecode's Python decoders run unchanged, on a built-in RustPython interpreter or the system's CPython."
[home_col2_h]
other = "One binary"
[home_col2_p]
other = "No C libraries. Static builds for Linux, macOS and Windows, with the decoders next to it."
[home_col3_h]
other = "Tested against the C"
[home_col3_p]
other = "Every driver is compared with libsigrok on a device model the kernel cannot tell apart from hardware. {link}."
