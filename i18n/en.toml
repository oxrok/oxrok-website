[dec_row_for]
other = "Use it for"
[dec_for_native]
other = "Everyday decoding"
[dec_for_rustpython]
other = "Your own or newer Python decoders, with nothing else to install"
[dec_for_cpython]
other = "Python decoders on a machine with Python, when decode time matters"

[dec_choose_h]
other = "Which one runs"
[dec_choose_p]
other = "A native decoder always takes precedence over a Python decoder with the same id. A Python decoder is looked for in <code>OXROK_DECODERS_DIR</code>, <code>SIGROKDECODE_DIR</code>, <code>decoders</code> next to the executable, <code>~/.local/share/libsigrokdecode/decoders</code> and the system directories. With both Python hosts built in, CPython is used unless <code>OXROK_PYTHON=rustpython</code>. Native and Python decoders stack freely: <code>-P uart,midi</code> works whichever runs each layer."
[dec_install_p]
other = "The {link} has the build commands for each feature."
[dec_install_link]
other = "install page"

[dec_checked_h]
other = "How they are checked"
[dec_checked_p]
other = "Every native decoder has a parity test: it runs in the same process as the Python decoder it was ported from, on the same capture and configuration, and the whole output sequence (annotations, sample ranges, binary output, items passed to stacked decoders and metadata) must match. The sigrok-test corpus is a larger, opt-in run of the same comparison. <code>uart</code>, <code>i2c</code> and <code>spi</code> are also compared byte for byte with sigrok-cli. The two Python hosts print the same bytes over the sigrok-test runs. The {link} have the details."
[dec_docs_link]
