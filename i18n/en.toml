[home_written_h]
other = "How it was written"
[home_written_p1]
other = "oxrok is a translation of the sigrok C and Python code into Rust, done by a large language model, with a human directing the work: choosing what to port, reviewing the structure and the protocol handling, wiring up the bench hardware and running the comparisons. Read the code with that in mind, and read the {link} for what has met which kind of evidence."
[home_written_link]
other = "driver table"
[home_written_p2]
other = "for what has met which kind of evidence."

[home_tested_h]
other = "How it is tested"
[home_tested_p]
other = "We don't own the hardware for most of these drivers, so we make the kernel think we do: each is a model in Rust, attached over USB/IP (<code>vhci-hcd</code>) so it's a real USB device as far as the kernel is concerned. The real sigrok-cli and oxrok then run unmodified against the same device, every transaction logged and compared. The models are built to misbehave — stalls, unplugs, late replies, bad frames. {link}."
[home_tested_link]
other = "The whole method, and its limits"

[home_vusb_p1]
other = "The models run on {link}, a virtual USB library that puts a device on the bus that is only Rust code."
[home_vusb_link]
other = "vusb"
[home_vusb_p2]
other = "a virtual USB library that puts a device on the bus that is only Rust code."

